<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeamSpark Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="chat-page">

    <header id="appNavbar" class="app-navbar" hidden>

        <a href="guide.html" class="app-logo">
            TeamSpark
        </a>

        <nav class="app-nav" aria-label="Main navigation">

            <a href="guide.html">Discover</a>

            <a href="matches.html">Teammates</a>

            <a href="chat.html">Chat</a>

            <a href="profile.html?view=account">My Account</a>

        </nav>

    </header>

    <h1>TeamSpark Safe Chat</h1>

    <p>
        Choose a message below to communicate safely with your teammate.
    </p>

    <div id="chatMessages"></div>

    <div id="messageChoices">

        <button class="presetMessage" data-code="team_up">
            Hi! I’m interested in teaming up.
        </button>
        
        <button class="presetMessage" data-code="event_choice">
            What event would you like to work on?
        </button>
        
        <button class="presetMessage" data-code="weekend_available">
            Are you available this weekend?
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
